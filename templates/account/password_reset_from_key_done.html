{% extends "base.html" %}
{% load static %}

{% block title %}Password Changed{% endblock title %}

{% block content %}
<div class="flex min-h-full flex-col justify-center py-20 sm:px-6 lg:px-8 bg-gradient-to-b from-teal-50 via-white to-white">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
      <img class="mx-auto h-12 w-auto" src="{% static 'images/logo.png' %}" alt="Project CTW">
      <h2 class="mt-8 text-center text-3xl font-bold leading-9 tracking-tight text-slate-900">Password changed</h2>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-[480px]">
      <div class="card mx-4 px-6 py-8 sm:px-12 text-center">
        <p class="text-sm text-slate-600">
          Your password has been changed successfully.
        </p>
      </div>

      <p class="mt-6 text-center text-sm text-slate-600">
        <a href="{% url 'account_login' %}" class="font-semibold text-teal-600 transition-colors duration-150 hover:text-teal-700">Sign in</a>
      </p>
    </div>
  </div>
{% endblock content %}
